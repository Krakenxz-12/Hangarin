{% extends "base.html" %}

{% block title %}Subtask | Hangarin{% endblock %}

{% block content %}

<div class="content">
    <div class="page-inner">

        <div class="page-header">
            <h4 class="page-title">Subtask</h4>
        </div>

        <div class="card">

            <div class="card-body">

                <form method="post">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button class="btn btn-primary">
                        Save Subtask
                    </button>

                    <a
                        href="{% url 'subtask-list' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>
</div>

{% endblock %}
