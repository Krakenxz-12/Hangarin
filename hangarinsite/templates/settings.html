{% extends "base.html" %}

{% block content %}

<div class="container-fluid">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="card">
                <div class="card-header">
                    <h4 class="card-title mb-0">Account Settings</h4>
                </div>

                <div class="card-body">

                    <div class="list-group">

                        <a href="{% url 'profile-edit' %}"
                           class="list-group-item list-group-item-action">
                            <strong>Edit Profile</strong>
                            <br>
                            <small class="text-muted">
                                Update your name, username, and email.
                            </small>
                        </a>

                        <a href="{% url 'account_change_password' %}"
                           class="list-group-item list-group-item-action">
                            <strong>Change Password</strong>
                            <br>
                            <small class="text-muted">
                                Change your account password.
                            </small>
                        </a>

                        <a href="{% url 'account_email' %}"
                           class="list-group-item list-group-item-action">
                            <strong>Email Settings</strong>
                            <br>
                            <small class="text-muted">
                                Manage your account email addresses.
                            </small>
                        </a>

                        <a href="{% url 'socialaccount_connections' %}"
                           class="list-group-item list-group-item-action">
                            <strong>Connected Accounts</strong>
                            <br>
                            <small class="text-muted">
                                Manage your Google and GitHub connections.
                            </small>
                        </a>

                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

{% endblock %}
