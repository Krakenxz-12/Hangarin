{% extends "base.html" %}

{% block title %}Delete Note | Hangarin{% endblock %}

{% block content %}

<div class="content">
    <div class="page-inner">

        <div class="card">

            <div class="card-body">

                <h4>Delete Note</h4>

                <p>
                    Are you sure you want to delete this note?
                </p>

                <p>
                    <strong>{{ object.content }}</strong>
                </p>

                <form method="post">

                    {% csrf_token %}

                    <button class="btn btn-danger">
                        Yes, Delete
                    </button>

                    <a
                        href="{% url 'note-list' %}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </form>

            </div>

        </div>

    </div>
</div>

{% endblock %}
